name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/order-service/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check Python
        run: ruff check .
      - name: Run tests
        run: pytest
      - name: Validate AsyncAPI
        working-directory: .
        run: npx --yes @asyncapi/cli@latest validate contracts/asyncapi/order-events.yaml

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose up --detach --build --wait
      - name: Run smoke test
        run: bash scripts/smoke-test.sh
      - name: Show logs after failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down --volumes
